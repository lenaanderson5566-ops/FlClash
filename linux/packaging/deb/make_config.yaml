display_name: FastAI
package_name: fastai
maintainer:
  name: FastAI
  email: lenaanderson5566@gmail.com

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-1
  - libsecret-1-0

# The Helper unit is written on demand by the app, not at install time, so only
# its teardown belongs here; the binary is already gone when postrm runs.
postuninstall_scripts:
  - 'case "${1:-}" in remove|purge) ;; *) exit 0 ;; esac'
  - 'systemctl disable --now fastai-helper.service >/dev/null 2>&1 || true'
  - 'rm -f /etc/systemd/system/fastai-helper.service'
  - 'systemctl daemon-reload >/dev/null 2>&1 || true'

supported_mime_type: []

keywords:
  - fastai
  - Clash
  - ClashMeta
  - Proxy

generic_name: FastAI

categories:
  - Network

startup_notify: true
